dataSet = "/media/qiuyue/2_data/1_Dataset/proj_calibration/yvr/Verification/SLAMRecord/controller_2024-06-04-05-48-24"



cam_folder_prefix = "Camera"
cam_folder_subfix = "images"
cam_json = "data.json"
board_type = 0   # Dot:0    AprilTag:1
plate_num = 1
detect_thread_num = 4
imu_folder_name = "IMU0"
imu_json_name = "data.json"

[dot_plate]
dot_bin_file = "dotInfo.bin"
show_detect_picture = false
black_dot = false
adaptive_thresh = 0.9
window_ratio = 10
grid_spacing = 0.03175
grid_size = [30, 90]  # Array with two elements
grid_seed = 92
unique_size = 6
conic_min_area = 4.0
conic_symmetry = 0.25
conic_min_aspect = 0.3
min_area_point_num = 25


[apriltag_plate]
show_tag_detect = false
apriltag_bin_file = "apriltag_with_homo.bin"
black_board = 1
rows = 10
cols = 10
apriltag_start_id = 0
tag_size = 0.08 # m
tag_gap = 0.2 # ratio
pattern_num = 3

[calib_check]
calib_check_cid = [0, 1, 2, 3]
calib_file_name = "/media/qiuyue/2_data/1_Dataset/proj_calibration/yvr/VI/1_D3_EVT2/device_calibration_imu.xml"
calib_check_result_folder = "device_calibration_imu_KB16_8_4"
show_calib_check_img = false

[vi_calib]
#spline knot dt(ms)
spline_dt = 0.0033 #0.001 0.01 #0.0033

#to make sure every knot is set around image timestamp
shift_imu_data = true

#to make sure there's enough imu readings (maybe several seconds) before first image frame
skip_first_frames_num = 30

# ratio of the knots whose weights are higher than other knots
high_weight_knot_ratio = 0.05

# used in compute area
power = 2.0
#bin_name="aprilTag.bin"
#bin_name="aprilTag_opt_intr.bin"
bin_name = "aprilTag_deoutlier.bin"

# reprojectError
thresholdReprojectError = 10.0#1.0

# imu accel error threshold
accel_error_threshold = 10.5

#imu gyro error threshold
gyro_error_threshold = 10.05

# gravity norm
g_norm = 9.7946

# use_sim or not
use_sim = false

# noise level in sim data
noise_level = 0.0

# disturb level [deg], when set below zero, it means cam2plate poses are fixed
disturb_level = 0.2 # 0.5

# fix plate and camera extrinsic or not
fix_extr = true

# use intr rot factor
use_intr_rot_factor = true

# intr rot factor weight
intr_rot_factor_weight = 1.0

# res amplify ratio for line factors
res_amplify_ratio = 2.0

# disable_reproj_factor or nor
disable_reproj_factor = true

# use magic number in td
use_magic_number = true

#use_detected_corner or not to speed up calibration
use_detected_corner = true

#window size used in imu filtering
window_size = -2 # 150 # 100 # 30 50 70 100 120 150 170

#imu noise bak
gyro_std = 0.1
gyro_std2 = 0.01
gyro_std_high = 0.0025
#
acc_std = 0.5
acc_std2 = 0.05
acc_std_high = 0.01
#
g_std = 1.0
g_std2 = 1.0
#
pose_std = 0.01
pose_std2 = 0.01

# compensate imu intrinsic
comp_imu = true

verbose = true

opt_rolling_shutter = false
fix_imu_intr = false
opt_camera_intr = false
disable_imu_factor = false
fix_imu_bias=false

is_four_as_one = true