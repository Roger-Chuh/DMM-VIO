apriltag_bin_file_gray = "apriltag_gray.bin"
apriltag_bin_file_rgb = "apriltag_rgb.bin"
black_board = 1
rows = 10
cols = 10
apriltag_start_id = 0
tag_size = 0.08 # m
tag_gap = 0.2 # ratio
pattern_num = 3

[calib_check]
calib_check_cid = [0, 1, 2, 3]
#calib_file_name = "device_calibration_imu_kb20_joint_imu_intr.xml"
#calib_file_name = "device_calibration_imu_kb20_20.xml"
#calib_file_name = "device_calibration_imu_KB16.xml"
calib_file_name = "results/device_calibration3.xml"
#calib_file_name = "device_calibration3_wo_tri.xml"
#calib_check_result_folder = "calib_check_results"
calib_check_result_folder = "calib_check_results_with_tri"
#calib_check_result_folder = "calib_check_results_wo_tri"
show_calib_check_img = false

[vi_calib]
#spline knot dt(ms)
spline_dt=0.011 #0.001 0.01 #0.0033
spline_dt_rgb=0.088 # 0.088

#to make sure every knot is set around image timestamp
shift_imu_data=true

#to make sure there's enough imu readings (maybe several seconds) before first image frame
skip_first_frames_num=30

# ratio of the knots whose weights are higher than other knots
high_weight_knot_ratio=0.05

# used in compute area
power=2.0
#bin_name="aprilTag.bin"
#bin_name="aprilTag_opt_intr.bin"
bin_name="aprilTag_deoutlier.bin"

# reprojectError
thresholdReprojectError=10.0#1.0

# imu accel error threshold
accel_error_threshold=10.5

#imu gyro error threshold
gyro_error_threshold=10.05

# gravity norm
g_norm=9.7946

# use_sim or not
use_sim=false

# noise level in sim data
noise_level=0.0

# disturb level [deg], when set below zero, it means cam2plate poses are fixed
disturb_level=0.2 # 0.5

# fix plate and camera extrinsic or not
fix_extr=true

# use intr rot factor
use_intr_rot_factor=true

# intr rot factor weight
intr_rot_factor_weight=1.0

# res amplify ratio for line factors
res_amplify_ratio=10.0

# disable_reproj_factor or not
disable_reproj_factor=false

# resolution difference weight
resolution_difference_weight=100.0

# use trifocal tensor factor or not
use_trifocal_tensor_factor=false

# to speedup
vm_step_reproj = 10
vm_step_line = 6

# use magic number in td
use_magic_number=true

#use_detected_corner or not to speed up calibration
use_detected_corner=true

#window size used in imu filtering
window_size=-2 # 150 # 100 # 30 50 70 100 120 150 170

#imu noise bak
gyro_std=0.1
gyro_std2=0.01
gyro_std_high=0.0025
#
acc_std=0.5
acc_std2=0.05
acc_std_high=0.01
#
g_std=1.0
g_std2=1.0
#
pose_std=0.01
pose_std2=0.01

# compensate imu intrinsic
comp_imu=true

verbose=true

opt_Tc0ci=false
opt_visual_scale=false
opt_rolling_shutter=true
fix_imu_intr=true
opt_camera_intr=true
disable_imu_factor=false
fix_imu_bias=false

four_cam_calib_file_name="/media/roger/Elements_SE/CI/test/quick_test2/results/device_calibration_gray_vi.xml"
is_imu_calibrated=false
is_four_as_one=true

detect_only=false