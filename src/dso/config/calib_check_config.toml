[main]
calib_cid = [0, 1, 2, 3]
frame_mini_gap = 100000 #ns
frame_gap = 30000000 #ns
log_level = 0
save_folder = "results"
intr_folder = "intrinsic"
extr_folder = "extrinsic"
image_width = 640
image_height = 480
is_rgb = false
is_gray_rgb = false

[dataset]
